name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight deps
        # Deliberately skip torch/transformers (huge). Tests that need them use
        # pytest.importorskip and are skipped here; the pure-logic stats/corpus
        # tests still run on every push.
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pyyaml pytest flake8

      - name: Lint (syntax + undefined names only)
        run: |
          flake8 src scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: pytest tests/ -q
